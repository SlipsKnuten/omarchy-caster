[workspace]
members = ["crates/caster-core", "crates/caster-capture-hyprland"]
resolver = "3"

[package]
name = "omarchy-caster-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native Google Cast mirroring for Omarchy"

[features]
default = ["google-cast", "hyprland", "pulse-audio", "systemd"]
google-cast = []
hyprland = []
pulse-audio = []
systemd = []

[[bin]]
name = "caster"
path = "src/main.rs"

[dependencies]
anyhow = "1"
caster-capture-hyprland = { package = "omarchy-caster-capture-hyprland", path = "crates/caster-capture-hyprland" }
caster-core = { package = "omarchy-caster-core", path = "crates/caster-core" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
mdns-sd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
