[package]
name = "omacast-dev"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Experimental modular native Chromecast controller for Omarchy"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
mdns-sd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

