[package]
name = "omarchy-caster-capture-hyprland"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Hyprland capture adapter for Caster"
autoexamples = false

[[example]]
name = "capture_once"
path = "examples/capture_once.rs"

[[example]]
name = "synthetic_video_nut"
path = "examples/synthetic_nut.rs"

[dependencies]
anyhow = "1"
bitflags = "2"
caster-core = { package = "omarchy-caster-core", path = "../caster-core" }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
memmap2 = "0.9"
rustix = { version = "1", features = ["event", "fs", "time"] }
serde_json = "1"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-scanner = "0.31"
